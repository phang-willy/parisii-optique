name: Release beta

on:
  push:
    branches:
      - pre-prod
  workflow_dispatch:

concurrency:
  group: updates-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pre-prod
    steps:
      - name: Require pre-prod branch
        if: github.ref != 'refs/heads/pre-prod'
        run: |
          echo "Lancez ce workflow depuis la branche pre-prod."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Plan beta version
        id: plan
        run: |
          node scripts/release/version.mjs plan --channel beta | tee plan.json
          echo "release=$(node -p "JSON.parse(require('fs').readFileSync('plan.json','utf8')).release")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "JSON.parse(require('fs').readFileSync('plan.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Setup theme
        if: steps.plan.outputs.release == 'true'
        uses: ./.github/actions/setup-theme

      - name: Apply version
        if: steps.plan.outputs.release == 'true'
        run: node scripts/release/version.mjs apply --version "${{ steps.plan.outputs.version }}"

      - name: Package archives
        if: steps.plan.outputs.release == 'true'
        run: |
          VERSION="${{ steps.plan.outputs.version }}"
          mkdir -p release-artifacts
          node scripts/release/package-theme.mjs --version "$VERSION" --output "release-artifacts/parisii-optique-${VERSION}.zip"
          node scripts/release/package-plugin.mjs --slug parisii-optique-plugin --source parisii-optique-plugin --main parisii-optique-plugin.php --version "$VERSION" --output "release-artifacts/parisii-optique-plugin-${VERSION}.zip"
          node scripts/release/package-plugin.mjs --slug updates-plugin --source updates-plugin --main parisii-updates.php --version "$VERSION" --output "release-artifacts/updates-plugin-${VERSION}.zip"
          node scripts/release/write-catalog.mjs --dir release-artifacts --channel beta --version "$VERSION"

      - name: Publish beta
        if: steps.plan.outputs.release == 'true'
        env:
          SSH_HOST: ${{ secrets.PREPROD_HOST }}
          SSH_PORT: ${{ secrets.PREPROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PREPROD_USER }}
          SSH_KEY: ${{ secrets.PREPROD_SSH_KEY }}
          SSH_PATH: ${{ secrets.PREPROD_PATH }}
          CHANNEL: beta
          VERSION: ${{ steps.plan.outputs.version }}
          CATALOG: release-artifacts/latest.json
          ARTIFACTS_DIR: release-artifacts
        run: bash scripts/release/publish-vps.sh

      - name: Tag beta release
        if: success() && steps.plan.outputs.release == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          REMOTE_BRANCH="refs/remotes/origin/release/${VERSION}"
          if git fetch origin "refs/heads/release/${VERSION}:${REMOTE_BRANCH}"; then
            echo "La branche release/${VERSION} existe deja"
          else
            git add style.css package.json parisii-optique-plugin/parisii-optique-plugin.php updates-plugin/parisii-updates.php
            git commit -m "chore(release): ${VERSION} [skip ci]"
            git push origin "HEAD:refs/heads/release/${VERSION}"
            git update-ref "${REMOTE_BRANCH}" HEAD
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            if [ "$(git rev-parse "v${VERSION}^{}")" != "$(git rev-parse "${REMOTE_BRANCH}^{}")" ]; then
              echo "Le tag v${VERSION} pointe vers un autre commit"
              exit 1
            fi
          else
            git tag "v${VERSION}" "${REMOTE_BRANCH}"
          fi

      - name: Open version pull request
        if: always() && steps.plan.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin pre-prod
          git fetch origin "+refs/heads/release/*:refs/remotes/origin/release/*" || true
          found=0
          while read -r branch; do
            [ -n "$branch" ] || continue
            found=1
            if git merge-base --is-ancestor "origin/${branch}" origin/pre-prod; then
              echo "${branch} est deja dans pre-prod"
              continue
            fi
            if ! existing="$(gh pr list --head "$branch" --base pre-prod --state open --json number --jq '.[0].number')"; then
              echo "GitHub a refuse la lecture des pull requests. Dans Settings > Actions > General, coche Allow GitHub Actions to create and approve pull requests."
              exit 1
            fi
            if [ -n "$existing" ]; then
              echo "Pull request #${existing} deja ouverte pour ${branch}"
              continue
            fi
            version="${branch#release/}"
            if ! gh pr create --base pre-prod --head "$branch" --title "chore(release): ${version}" --body "La version ${version} est publiee sur le canal beta. Cette pull request aligne les numeros de version du depot."; then
              echo "GitHub a refuse la pull request. Dans Settings > Actions > General, coche Allow GitHub Actions to create and approve pull requests."
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/release)
          if [ "$found" -eq 0 ]; then
            echo "Aucune branche release a aligner"
          fi

      - name: Push beta tag
        if: success() && steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git push origin "refs/tags/v${VERSION}"
