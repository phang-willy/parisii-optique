name: "PRE-PRODUCTION - Deploy WordPress Theme"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - pre-prod
  pull_request:
    branches:
      - pre-prod
  workflow_dispatch:

jobs:
  deploy-pre-prod:
    if: github.ref == 'refs/heads/pre-prod' || (github.event_name == 'pull_request' && github.base_ref == 'pre-prod')
    runs-on: ubuntu-latest
    environment: pre-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build theme assets
        run: npm run build

      - name: Verify built CSS exists
        run: |
          test -f dist/style.css || (echo "::error::dist/style.css not generated"; exit 1)

      - name: Verify pre-prod server is operational
        run: |
          SITE_URL="https://${{ secrets.HOSTINGER_DOMAIN }}"
          echo "Checking $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Server unreachable or returned error"; exit 1)

      - name: Setup SSH
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH login
        if: github.event_name == 'push'
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} "whoami && pwd"

      - name: Deploy or update theme on Hostinger (sync changed files only)
        if: github.event_name == 'push'
        run: |
          THEME_PATH="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/${{ secrets.HOSTINGER_DOMAIN }}/public_html/wp-content/themes/parisii-optique"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} "mkdir -p $THEME_PATH"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }} -o BatchMode=yes -o IdentitiesOnly=yes" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.cursorrules' \
            --exclude='infos_ignore.md' \
            --exclude='.env' \
            ./ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:$THEME_PATH/

      - name: Verify theme exists (retry deploy if missing)
        if: github.event_name == 'push'
        run: |
          THEME_PATH="/home/${{ secrets.HOSTINGER_SSH_USER }}/domains/${{ secrets.HOSTINGER_DOMAIN }}/public_html/wp-content/themes/parisii-optique"
          verify_theme() {
            ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} \
              "test -f $THEME_PATH/style.css && test -f $THEME_PATH/dist/style.css && test -f $THEME_PATH/functions.php"
          }
          if ! verify_theme; then
            echo "Theme files missing, retrying deploy..."
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }} -o BatchMode=yes -o IdentitiesOnly=yes" \
              --exclude='.git' --exclude='node_modules' --exclude='.github' \
              --exclude='.gitignore' --exclude='package-lock.json' --exclude='package.json' \
              --exclude='.cursorrules' --exclude='infos_ignore.md' --exclude='.env' \
              ./ ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:$THEME_PATH/
            if ! verify_theme; then
              echo "::error::DEPLOY FAILED — Theme not found on server. style.css, dist/style.css and/or functions.php missing in $THEME_PATH"
              exit 1
            fi
          fi
          echo "Theme OK: style.css, dist/style.css and functions.php found"

      - name: Purge cache
        if: github.event_name == 'push' && vars.HOSTINGER_PURGE_ENABLED == 'true'
        run: |
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "${{ secrets.HOSTINGER_CACHE_PURGE_URL }}" | grep -q "200" || echo "Cache purge returned non-200 (continuing)"

      - name: Verify pre-prod site is still operational
        if: github.event_name == 'push'
        run: |
          SITE_URL="https://${{ secrets.HOSTINGER_DOMAIN }}"
          echo "Post-deploy check: $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Site unreachable after deployment"; exit 1)

      - name: Cleanup SSH
        if: always() && github.event_name == 'push'
        run: rm -f ~/.ssh/deploy_key
