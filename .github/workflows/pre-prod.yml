name: "PRE-PRODUCTION - Deploy WordPress Theme"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - pre-prod
  pull_request:
    branches:
      - pre-prod
  workflow_dispatch:

jobs:
  deploy-pre-prod:
    if: github.ref == 'refs/heads/pre-prod' || (github.event_name == 'pull_request' && github.base_ref == 'pre-prod')
    runs-on: ubuntu-latest
    environment: pre-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build

      - name: Verify built CSS exists
        run: |
          test -s dist/style.css || (echo "::error::dist/style.css not generated or empty"; exit 1)
          echo "dist/style.css size: $(wc -c < dist/style.css) bytes"

      - name: Verify pre-prod server is operational
        env:
          SITE_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
        run: |
          if [ -z "$SITE_DOMAIN" ]; then
            echo "::error::HOSTINGER_DOMAIN secret is empty. Set it on the pre-prod environment (hostname only, without https://)."
            exit 1
          fi
          SITE_DOMAIN="${SITE_DOMAIN#https://}"
          SITE_DOMAIN="${SITE_DOMAIN#http://}"
          SITE_DOMAIN="${SITE_DOMAIN%/}"
          SITE_URL="https://${SITE_DOMAIN}"
          echo "Checking $SITE_URL..."

          set +e
          HTTP_CODE=$(curl -sS -L --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0 (compatible; GitHubActions-HealthCheck/1.0)" \
            -o /dev/null -w "%{http_code}" "$SITE_URL" 2>/tmp/curl_preprod.txt)
          CURL_EXIT=$?
          set -e

          echo "HTTP status: ${HTTP_CODE:-000} (curl exit ${CURL_EXIT})"
          if [ -s /tmp/curl_preprod.txt ]; then
            echo "curl stderr:"
            cat /tmp/curl_preprod.txt
          fi

          case "$HTTP_CODE" in
            2*|3*|401|403)
              echo "Server reachable"
              ;;
            *)
              echo "::error::Server unreachable or returned error ${HTTP_CODE:-000}"
              exit 1
              ;;
          esac

      - name: Install lftp
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Prepare optional SFTP SSH key
        if: github.event_name == 'push'
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -n "${HOSTINGER_SSH_KEY}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "${HOSTINGER_SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Verify Hostinger SFTP login and path
        if: github.event_name == 'push'
        env:
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST || secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER || secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT || secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SFTP_THEME_PATH: ${{ secrets.HOSTINGER_SFTP_THEME_PATH }}
        run: |
          PORT="${HOSTINGER_SFTP_PORT:-22}"
          THEME_PATH="${HOSTINGER_SFTP_THEME_PATH:-/home/${HOSTINGER_FTP_USER}/domains/${HOSTINGER_DOMAIN}/public_html/wp-content/themes/parisii-optique}"
          THEME_PATH="${THEME_PATH#./}"

          test -n "${HOSTINGER_FTP_HOST}" || (echo "::error::HOSTINGER_FTP_HOST or HOSTINGER_SSH_HOST is required"; exit 1)
          test -n "${HOSTINGER_FTP_USER}" || (echo "::error::HOSTINGER_FTP_USER or HOSTINGER_SSH_USER is required"; exit 1)
          if [ -f ~/.ssh/deploy_key ]; then
            SFTP_CONNECT="ssh -a -x -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"
          else
            test -n "${HOSTINGER_FTP_PASSWORD}" || (echo "::error::HOSTINGER_FTP_PASSWORD or HOSTINGER_SSH_KEY is required for SFTP deploy without remote shell"; exit 1)
            SFTP_CONNECT="ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi

          echo "SFTP test: ${HOSTINGER_FTP_HOST}:${PORT} -> ${THEME_PATH}"
          lftp -c "
            set net:max-retries 3;
            set net:timeout 45;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"${SFTP_CONNECT}\";
            open -u \"${HOSTINGER_FTP_USER}\",\"${HOSTINGER_FTP_PASSWORD}\" sftp://${HOSTINGER_FTP_HOST}:${PORT};
            mkdir -p ${THEME_PATH};
            mkdir -p ${THEME_PATH}/dist;
            cd ${THEME_PATH};
            bye
          " || { echo "::error::SFTP login/path failed. Check HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD, HOSTINGER_SFTP_PORT and HOSTINGER_SFTP_THEME_PATH."; exit 1; }

      - name: Deploy theme on Hostinger via SFTP
        if: github.event_name == 'push'
        env:
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST || secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER || secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT || secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SFTP_THEME_PATH: ${{ secrets.HOSTINGER_SFTP_THEME_PATH }}
        run: |
          PORT="${HOSTINGER_SFTP_PORT:-22}"
          THEME_PATH="${HOSTINGER_SFTP_THEME_PATH:-/home/${HOSTINGER_FTP_USER}/domains/${HOSTINGER_DOMAIN}/public_html/wp-content/themes/parisii-optique}"
          THEME_PATH="${THEME_PATH#./}"
          if [ -f ~/.ssh/deploy_key ]; then
            SFTP_CONNECT="ssh -a -x -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"
          else
            test -n "${HOSTINGER_FTP_PASSWORD}" || (echo "::error::HOSTINGER_FTP_PASSWORD or HOSTINGER_SSH_KEY is required for SFTP deploy without remote shell"; exit 1)
            SFTP_CONNECT="ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi

          echo "Deploy SFTP sftp://${HOSTINGER_FTP_HOST}:${PORT} -> ${THEME_PATH}"
          lftp -c "
            set net:max-retries 5;
            set net:timeout 120;
            set net:reconnect-interval-base 10;
            set net:limit-rate 0;
            set mirror:parallel-transfer-count 8;
            set mirror:parallel-directories yes;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"${SFTP_CONNECT}\";

            open -u \"${HOSTINGER_FTP_USER}\",\"${HOSTINGER_FTP_PASSWORD}\" sftp://${HOSTINGER_FTP_HOST}:${PORT};
            mkdir -p ${THEME_PATH};
            mkdir -p ${THEME_PATH}/dist;
            cd ${THEME_PATH};

            mirror -R --delete --overwrite --parallel=8 \
              --exclude-glob 'src/**' \
              -X .git \
              -X node_modules \
              -X .github \
              -X .gitignore \
              -X package-lock.json \
              -X package.json \
              -X webpack.config.js \
              -X .cursorrules \
              -X 'infos_ignore.md' \
              -X .env \
              -X 'README.md' \
              -X wp-config.php \
              ./ ${THEME_PATH}/;

            put -O ${THEME_PATH}/dist dist/style.css;
            mirror -R --overwrite blocks/dist ${THEME_PATH}/blocks/dist;
            bye
          "

      - name: Verify deployed theme files via SFTP
        if: github.event_name == 'push'
        env:
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
          HOSTINGER_FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST || secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_FTP_USER: ${{ secrets.HOSTINGER_FTP_USER || secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_SFTP_PORT: ${{ secrets.HOSTINGER_SFTP_PORT || secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SFTP_THEME_PATH: ${{ secrets.HOSTINGER_SFTP_THEME_PATH }}
        run: |
          PORT="${HOSTINGER_SFTP_PORT:-22}"
          THEME_PATH="${HOSTINGER_SFTP_THEME_PATH:-/home/${HOSTINGER_FTP_USER}/domains/${HOSTINGER_DOMAIN}/public_html/wp-content/themes/parisii-optique}"
          THEME_PATH="${THEME_PATH#./}"
          if [ -f ~/.ssh/deploy_key ]; then
            SFTP_CONNECT="ssh -a -x -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/deploy_key"
          else
            test -n "${HOSTINGER_FTP_PASSWORD}" || (echo "::error::HOSTINGER_FTP_PASSWORD or HOSTINGER_SSH_KEY is required for SFTP deploy without remote shell"; exit 1)
            SFTP_CONNECT="ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          fi

          ROOT_OUTPUT=$(lftp -c "
            set net:max-retries 3;
            set net:timeout 60;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"${SFTP_CONNECT}\";
            open -u \"${HOSTINGER_FTP_USER}\",\"${HOSTINGER_FTP_PASSWORD}\" sftp://${HOSTINGER_FTP_HOST}:${PORT};
            cls -1 ${THEME_PATH}/;
            bye
          " 2>&1)

          DIST_OUTPUT=$(lftp -c "
            set net:max-retries 3;
            set net:timeout 60;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"${SFTP_CONNECT}\";
            open -u \"${HOSTINGER_FTP_USER}\",\"${HOSTINGER_FTP_PASSWORD}\" sftp://${HOSTINGER_FTP_HOST}:${PORT};
            cls -1 ${THEME_PATH}/dist/;
            bye
          " 2>&1)

          echo "$ROOT_OUTPUT" | grep -qw "style.css" || (echo "::error::Theme root style.css missing in ${THEME_PATH}"; exit 1)
          echo "$ROOT_OUTPUT" | grep -qw "functions.php" || (echo "::error::functions.php missing in ${THEME_PATH}"; exit 1)
          echo "$DIST_OUTPUT" | grep -qw "style.css" || (echo "::error::dist/style.css missing in ${THEME_PATH}/dist"; exit 1)
          echo "Theme OK via SFTP: style.css, dist/style.css and functions.php found"

      - name: Verify deployed CSS over HTTP
        if: github.event_name == 'push'
        run: |
          CSS_URL="https://${{ secrets.HOSTINGER_DOMAIN }}/wp-content/themes/parisii-optique/dist/style.css?deploy=${GITHUB_SHA}"
          echo "Checking CSS URL: $CSS_URL"
          curl -fsSL --connect-timeout 10 --max-time 30 "$CSS_URL" -o /tmp/preprod-style.css
          BYTES="$(wc -c < /tmp/preprod-style.css | tr -d ' ')"
          echo "Downloaded CSS size: ${BYTES} bytes"
          test "$BYTES" -gt 10000 || (echo "::error::CSS is missing or unexpectedly small at $CSS_URL"; exit 1)

      - name: Purge cache
        if: github.event_name == 'push' && vars.HOSTINGER_PURGE_ENABLED == 'true'
        run: |
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "${{ secrets.HOSTINGER_CACHE_PURGE_URL }}" | grep -q "200" || echo "Cache purge returned non-200 (continuing)"

      - name: Verify pre-prod site is still operational
        if: github.event_name == 'push'
        env:
          SITE_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
        run: |
          SITE_DOMAIN="${SITE_DOMAIN#https://}"
          SITE_DOMAIN="${SITE_DOMAIN#http://}"
          SITE_DOMAIN="${SITE_DOMAIN%/}"
          SITE_URL="https://${SITE_DOMAIN}"
          echo "Post-deploy check: $SITE_URL..."

          set +e
          HTTP_CODE=$(curl -sS -L --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0 (compatible; GitHubActions-HealthCheck/1.0)" \
            -o /dev/null -w "%{http_code}" "$SITE_URL" 2>/tmp/curl_preprod_post.txt)
          CURL_EXIT=$?
          set -e

          echo "HTTP status: ${HTTP_CODE:-000} (curl exit ${CURL_EXIT})"
          if [ -s /tmp/curl_preprod_post.txt ]; then
            echo "curl stderr:"
            cat /tmp/curl_preprod_post.txt
          fi

          case "$HTTP_CODE" in
            2*|3*|401|403)
              echo "Site reachable after deployment"
              ;;
            *)
              echo "::error::Site unreachable after deployment (${HTTP_CODE:-000})"
              exit 1
              ;;
          esac

      - name: Cleanup SFTP key
        if: always() && github.event_name == 'push'
        run: rm -f ~/.ssh/deploy_key
