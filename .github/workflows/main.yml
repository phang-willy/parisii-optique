name: "PRODUCTION - Deploy WordPress Theme"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build theme assets
        run: npm run build

      - name: Verify built CSS exists
        run: |
          test -f dist/style.css || (echo "::error::dist/style.css not generated"; exit 1)

      - name: Verify production server is operational
        run: |
          SITE_URL="https://${{ secrets.OVH_DOMAIN }}"
          echo "Checking $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Server unreachable or returned error"; exit 1)

      - name: Install lftp
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # Hébergement web OVH (cluster) : FileZilla utilise SFTP sur le port 22, pas FTP/FTPS.
      # Secrets : OVH_FTP_HOST = ftp.clusterXXX.hosting.ovh.net, OVH_FTP_USER / OVH_FTP_PASSWORD = identiques SFTP.
      # Optionnel : OVH_SFTP_PORT (défaut 22).
      - name: Deploy or update theme on OVH via SFTP
        if: github.event_name == 'push'
        env:
          REMOTE_PATH: /home/${{ secrets.OVH_FTP_USER }}/www/wp-content/themes/parisii-optique
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
        run: |
          PORT="${OVH_SFTP_PORT:-22}"
          echo "Deploy SFTP sftp://${OVH_FTP_HOST}:${PORT} -> ${REMOTE_PATH}"

          lftp -c "
            set net:max-retries 5;
            set net:timeout 120;
            set net:reconnect-interval-base 10;
            set net:limit-rate 0;
            set mirror:parallel-transfer-count 8;
            set mirror:parallel-directories yes;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o BatchMode=yes -o StrictHostKeyChecking=accept-new\";

            open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
            mkdir -p ${REMOTE_PATH};
            mirror -R --overwrite --parallel=8 \
              -X .git \
              -X node_modules \
              -X .github \
              -X .gitignore \
              -X package-lock.json \
              -X package.json \
              -X .cursorrules \
              -X 'infos_ignore.md' \
              -X .env \
              ./ ${REMOTE_PATH}/;
            bye
          "

      - name: Verify theme exists (retry deploy if missing)
        if: github.event_name == 'push'
        env:
          REMOTE_PATH: /home/${{ secrets.OVH_FTP_USER }}/www/wp-content/themes/parisii-optique
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
        run: |
          PORT="${OVH_SFTP_PORT:-22}"

          verify_theme_sftp() {
            ROOT_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o BatchMode=yes -o StrictHostKeyChecking=accept-new\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              cls -1 ${REMOTE_PATH}/;
              bye
            " 2>&1)
            DIST_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o BatchMode=yes -o StrictHostKeyChecking=accept-new\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              cls -1 ${REMOTE_PATH}/dist/;
              bye
            " 2>&1)
            echo "$ROOT_OUTPUT" | grep -qw "style.css" && echo "$ROOT_OUTPUT" | grep -qw "functions.php" && echo "$DIST_OUTPUT" | grep -qw "style.css"
          }

          redeploy_sftp() {
            lftp -c "
              set net:max-retries 5;
              set net:timeout 120;
              set mirror:parallel-transfer-count 8;
              set mirror:parallel-directories yes;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o BatchMode=yes -o StrictHostKeyChecking=accept-new\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              mkdir -p ${REMOTE_PATH};
              mirror -R --overwrite --parallel=8 \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                ./ ${REMOTE_PATH}/;
              bye
            "
          }

          if verify_theme_sftp; then
            echo "Theme OK (SFTP): style.css, dist/style.css, functions.php"
          else
            echo "Theme missing on server, retrying SFTP deploy..."
            redeploy_sftp
            if ! verify_theme_sftp; then
              echo "::error::DEPLOY FAILED — Theme not found after SFTP. Check REMOTE_PATH and OVH_FTP_HOST (e.g. ftp.cluster121.hosting.ovh.net)."
              exit 1
            fi
            echo "Theme OK after retry (SFTP)"
          fi

      - name: Purge cache
        if: github.event_name == 'push' && vars.OVH_PURGE_ENABLED == 'true'
        run: |
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "${{ secrets.OVH_CACHE_PURGE_URL }}" | grep -q "200" || echo "Cache purge returned non-200 (continuing)"

      - name: Verify production site is still operational
        if: github.event_name == 'push'
        run: |
          SITE_URL="https://${{ secrets.OVH_DOMAIN }}"
          echo "Post-deploy check: $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Site unreachable after deployment"; exit 1)
