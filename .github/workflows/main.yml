name: "PRODUCTION - Deploy WordPress Theme"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history lets git-restore-mtime set realistic file mtimes → mirror --only-newer skips unchanged files.
          fetch-depth: 0

      - name: Restore git file mtimes (incremental SFTP)
        if: github.event_name == 'push'
        uses: chetan/git-restore-mtime-action@v2

      - name: Verify production server is operational
        env:
          SITE_DOMAIN: ${{ secrets.OVH_DOMAIN }}
        run: |
          if [ -z "$SITE_DOMAIN" ]; then
            echo "::error::OVH_DOMAIN secret is empty. Set it on the production environment (hostname only, without https://)."
            exit 1
          fi
          SITE_DOMAIN="${SITE_DOMAIN#https://}"
          SITE_DOMAIN="${SITE_DOMAIN#http://}"
          SITE_DOMAIN="${SITE_DOMAIN%/}"
          SITE_URL="https://${SITE_DOMAIN}"
          echo "Checking $SITE_URL..."

          set +e
          HTTP_CODE=$(curl -sS -L --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0 (compatible; GitHubActions-HealthCheck/1.0)" \
            -o /dev/null -w "%{http_code}" "$SITE_URL" 2>/tmp/curl_prod.txt)
          CURL_EXIT=$?
          set -e

          echo "HTTP status: ${HTTP_CODE:-000} (curl exit ${CURL_EXIT})"
          if [ -s /tmp/curl_prod.txt ]; then
            echo "curl stderr:"
            cat /tmp/curl_prod.txt
          fi

          case "$HTTP_CODE" in
            2*|3*|401|403)
              echo "Server reachable"
              ;;
            *)
              echo "::warning::Server unreachable or returned error ${HTTP_CODE:-000}. Continuing with deploy."
              ;;
          esac

      - name: Install lftp
        if: github.event_name == 'push'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y lftp

      # Juste après le check HTTP : login SFTP avant npm/build (échec rapide si secrets faux).
      - name: Verify OVH SFTP login
        if: github.event_name == 'push'
        env:
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
        run: |
          PORT="${OVH_SFTP_PORT:-22}"
          echo "SFTP test: ${OVH_FTP_HOST}:${PORT} (user: ${OVH_FTP_USER})"
          lftp -c "
            set net:max-retries 3;
            set net:timeout 45;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
            open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
            pwd;
            bye
          " || { echo "::error::SFTP login échoué — vérifie OVH_FTP_USER, OVH_FTP_PASSWORD, OVH_FTP_HOST, OVH_SFTP_PORT (défaut 22)."; exit 1; }
          echo "SFTP login OK"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build theme assets
        run: npm run build

      - name: Verify built CSS exists
        run: |
          test -f dist/style.css || (echo "::error::dist/style.css not generated"; exit 1)

      # Chemin par défaut = celui affiché dans FileZilla : /home/USER/www/wp-content/themes/parisii-optique
      # Surcharge : secret OVH_SFTP_THEME_PATH (relatif ou absolu si ton hébergeur diffère).
      # lftp : open -u user,password (virgule dans le MDP = cassé → clé SSH).
      - name: Deploy or update theme on OVH via SFTP
        if: github.event_name == 'push'
        env:
          OVH_SFTP_THEME_PATH: ${{ secrets.OVH_SFTP_THEME_PATH }}
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
        run: |
          PORT="${OVH_SFTP_PORT:-22}"
          DEFAULT_THEME="/home/${OVH_FTP_USER}/www/wp-content/themes/parisii-optique"
          THEME_PATH="${OVH_SFTP_THEME_PATH:-$DEFAULT_THEME}"
          THEME_PATH="${THEME_PATH#./}"
          echo "Deploy SFTP sftp://${OVH_FTP_HOST}:${PORT} -> ${THEME_PATH}"

          lftp -c "
            set net:max-retries 3;
            set net:timeout 45;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
            open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
            cd ${THEME_PATH};
            bye
          " || { echo "::error::Remote path does not exist: ${THEME_PATH}. Set OVH_SFTP_THEME_PATH correctly."; exit 1; }

          lftp -c "
            set net:max-retries 5;
            set net:timeout 120;
            set net:reconnect-interval-base 10;
            set net:limit-rate 0;
            set mirror:parallel-transfer-count 8;
            set mirror:parallel-directories yes;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";

            open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
            cd ${THEME_PATH};
            mirror -R --overwrite --parallel=8 \
              --exclude-glob 'src/**' \
              -X .git \
              -X node_modules \
              -X .github \
              -X .gitignore \
              -X package-lock.json \
              -X package.json \
              -X .cursorrules \
              -X 'infos_ignore.md' \
              -X .env \
              -X 'README.md' \
              ./ ${THEME_PATH}/;
            bye
          "

      - name: Verify theme exists (retry deploy if missing)
        if: github.event_name == 'push'
        env:
          OVH_SFTP_THEME_PATH: ${{ secrets.OVH_SFTP_THEME_PATH }}
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_SFTP_PORT: ${{ secrets.OVH_SFTP_PORT }}
        run: |
          PORT="${OVH_SFTP_PORT:-22}"
          DEFAULT_THEME="/home/${OVH_FTP_USER}/www/wp-content/themes/parisii-optique"
          THEME_PATH="${OVH_SFTP_THEME_PATH:-$DEFAULT_THEME}"
          THEME_PATH="${THEME_PATH#./}"

          echo "Re-check SFTP login before theme verification..."
          lftp -c "
            set net:max-retries 3;
            set net:timeout 45;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
            open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
            bye
          " || { echo "::error::SFTP login échoué avant vérification du thème."; exit 1; }

          verify_theme_sftp() {
            ROOT_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              cls -1 ${THEME_PATH}/;
              bye
            " 2>&1)
            DIST_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              cls -1 ${THEME_PATH}/dist/;
              bye
            " 2>&1)
            echo "$ROOT_OUTPUT" | grep -qw "style.css" && echo "$ROOT_OUTPUT" | grep -qw "functions.php" && echo "$DIST_OUTPUT" | grep -qw "style.css"
          }

          redeploy_sftp() {
            lftp -c "
              set net:max-retries 3;
              set net:timeout 45;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              cd ${THEME_PATH};
              bye
            " || { echo "::error::Remote path does not exist: ${THEME_PATH}. Set OVH_SFTP_THEME_PATH correctly."; exit 1; }

            lftp -c "
              set net:max-retries 5;
              set net:timeout 120;
              set mirror:parallel-transfer-count 8;
              set mirror:parallel-directories yes;
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no\";
              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} sftp://${OVH_FTP_HOST}:${PORT};
              cd ${THEME_PATH};
              mirror -R --overwrite --parallel=8 \
                --exclude-glob 'src/**' \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                -X 'README.md' \
                ./ ${THEME_PATH}/;
              bye
            "
          }

          if verify_theme_sftp; then
            echo "Theme OK (SFTP): style.css, dist/style.css, functions.php"
          else
            echo "Theme missing on server, retrying SFTP deploy..."
            redeploy_sftp
            if ! verify_theme_sftp; then
              echo "::error::DEPLOY FAILED — Vérifie OVH_SFTP_THEME_PATH (chemin vu depuis FileZilla) et OVH_FTP_HOST."
              exit 1
            fi
            echo "Theme OK after retry (SFTP)"
          fi

      - name: Purge cache
        if: github.event_name == 'push' && vars.OVH_PURGE_ENABLED == 'true'
        run: |
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "${{ secrets.OVH_CACHE_PURGE_URL }}" | grep -q "200" || echo "Cache purge returned non-200 (continuing)"

      - name: Verify production site is still operational
        if: github.event_name == 'push'
        env:
          SITE_DOMAIN: ${{ secrets.OVH_DOMAIN }}
        run: |
          SITE_DOMAIN="${SITE_DOMAIN#https://}"
          SITE_DOMAIN="${SITE_DOMAIN#http://}"
          SITE_DOMAIN="${SITE_DOMAIN%/}"
          SITE_URL="https://${SITE_DOMAIN}"
          echo "Post-deploy check: $SITE_URL..."

          set +e
          HTTP_CODE=$(curl -sS -L --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 45 \
            -A "Mozilla/5.0 (compatible; GitHubActions-HealthCheck/1.0)" \
            -o /dev/null -w "%{http_code}" "$SITE_URL" 2>/tmp/curl_prod_post.txt)
          CURL_EXIT=$?
          set -e

          echo "HTTP status: ${HTTP_CODE:-000} (curl exit ${CURL_EXIT})"
          if [ -s /tmp/curl_prod_post.txt ]; then
            echo "curl stderr:"
            cat /tmp/curl_prod_post.txt
          fi

          case "$HTTP_CODE" in
            2*|3*|401|403)
              echo "Site reachable after deployment"
              ;;
            *)
              echo "::error::Site unreachable after deployment (${HTTP_CODE:-000})"
              exit 1
              ;;
          esac
