name: "PRODUCTION - Deploy WordPress Theme"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify production server is operational
        run: |
          SITE_URL="https://${{ secrets.OVH_DOMAIN }}"
          echo "Checking $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Server unreachable or returned error"; exit 1)

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # Choose ONE of the next two deploy steps:
      # - OVH mutualized most often supports FTPS (explicit TLS) and NOT SFTP.
      # - If your OVH really supports SFTP, switch protocol to sftp:// and remove the FTP TLS settings.

      - name: Deploy or update theme on OVH via FTPS
        env:
          REMOTE_PATH: /home/${{ secrets.OVH_FTP_USER }}/www/wp-content/themes/parisii-optique
        run: |
          lftp -c "
            set net:max-retries 2;
            set net:timeout 20;
            set net:reconnect-interval-base 5;

            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;

            open -u ${{ secrets.OVH_FTP_USER }},${{ secrets.OVH_FTP_PASSWORD }} ftps://${{ secrets.OVH_FTP_HOST }}:${{ secrets.OVH_FTP_PORT }};
            mkdir -p $REMOTE_PATH;
            mirror -R -v --overwrite \
              -X .git \
              -X node_modules \
              -X .github \
              -X .gitignore \
              -X .cursorrules \
              -X 'infos_ignore.md' \
              -X .env \
              ./ $REMOTE_PATH/;
            bye
          "

      - name: Verify theme exists (retry deploy if missing)
        env:
          REMOTE_PATH: /home/${{ secrets.OVH_FTP_USER }}/www/wp-content/themes/parisii-optique
        run: |
          deploy_ovh() {
            lftp -c "
              set net:max-retries 2;
              set net:timeout 20;
              set net:reconnect-interval-base 5;

              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;

              open -u ${{ secrets.OVH_FTP_USER }},${{ secrets.OVH_FTP_PASSWORD }} ftps://${{ secrets.OVH_FTP_HOST }}:${{ secrets.OVH_FTP_PORT }};
              mkdir -p $REMOTE_PATH;
              mirror -R -v --overwrite \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                ./ $REMOTE_PATH/;
              bye
            "
          }

          verify_theme() {
            OUTPUT=$(lftp -c "
              set net:max-retries 1;
              set net:timeout 20;

              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;

              open -u ${{ secrets.OVH_FTP_USER }},${{ secrets.OVH_FTP_PASSWORD }} ftps://${{ secrets.OVH_FTP_HOST }}:${{ secrets.OVH_FTP_PORT }};
              cls -1 $REMOTE_PATH/;
              bye
            " 2>&1)

            echo "$OUTPUT" | grep -qw "style.css" && echo "$OUTPUT" | grep -qw "functions.php"
          }

          if ! verify_theme; then
            echo "Theme files missing, retrying deploy..."
            deploy_ovh
            if ! verify_theme; then
              echo "::error::DEPLOY FAILED — Theme not found on server. style.css and/or functions.php missing in $REMOTE_PATH"
              exit 1
            fi
          fi

          echo "Theme OK: style.css and functions.php found"

      - name: Purge cache
        if: vars.OVH_PURGE_ENABLED == 'true'
        run: |
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "${{ secrets.OVH_CACHE_PURGE_URL }}" | grep -q "200" || echo "Cache purge returned non-200 (continuing)"

      - name: Verify production site is still operational
        run: |
          SITE_URL="https://${{ secrets.OVH_DOMAIN }}"
          echo "Post-deploy check: $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Site unreachable after deployment"; exit 1)
