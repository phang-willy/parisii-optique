name: "PRODUCTION - Deploy WordPress Theme"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build theme assets
        run: npm run build

      - name: Verify built CSS exists
        run: |
          test -f dist/style.css || (echo "::error::dist/style.css not generated"; exit 1)

      - name: Verify production server is operational
        run: |
          SITE_URL="https://${{ secrets.OVH_DOMAIN }}"
          echo "Checking $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Server unreachable or returned error"; exit 1)

      - name: Install lftp
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # Choose ONE of the next two deploy steps:
      # - OVH mutualized most often supports FTPS (explicit TLS) and NOT SFTP.
      # - If your OVH really supports SFTP, switch protocol to sftp:// and remove the FTP TLS settings.

      # OVH mutualisé: souvent FTP clair sur :21, parfois FTPS explicite, parfois implicite :990
      - name: Deploy or update theme on OVH via FTP / FTPS
        if: github.event_name == 'push'
        env:
          REMOTE_PATH: /home/${{ secrets.OVH_FTP_USER }}/www/wp-content/themes/parisii-optique
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
        run: |
          deploy_ovh_ftps() {
            local remote_url="$1"
            echo "Trying FTPS (TLS forced) with ${remote_url}"
            lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set net:reconnect-interval-base 10;
              set net:limit-rate 0;

              set ftp:ssl-allow yes;
              set ftp:ssl-force yes;
              set ftp:ssl-protect-data yes;
              set ssl:verify-certificate no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ${remote_url};
              mkdir -p ${REMOTE_PATH};
              mirror -R -v --overwrite \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                ./ ${REMOTE_PATH}/;
              bye
            "
          }

          deploy_ovh_plain_ftp() {
            local remote_url="$1"
            echo "Trying plain FTP (no TLS) with ${remote_url}"
            lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set net:reconnect-interval-base 10;
              set net:limit-rate 0;

              set ftp:ssl-allow no;
              set ftp:ssl-force no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ${remote_url};
              mkdir -p ${REMOTE_PATH};
              mirror -R -v --overwrite \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                ./ ${REMOTE_PATH}/;
              bye
            "
          }

          deploy_ovh_ftps "ftp://${OVH_FTP_HOST}:21" || \
            deploy_ovh_ftps "ftps://${OVH_FTP_HOST}:990" || \
            deploy_ovh_plain_ftp "ftp://${OVH_FTP_HOST}:21"

      - name: Verify theme exists (retry deploy if missing)
        if: github.event_name == 'push'
        env:
          REMOTE_PATH: /home/${{ secrets.OVH_FTP_USER }}/www/wp-content/themes/parisii-optique
          OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
        run: |
          deploy_ovh_by_url() {
            local remote_url="$1"
            lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set net:reconnect-interval-base 10;
              set net:limit-rate 0;

              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ${remote_url};
              mkdir -p ${REMOTE_PATH};
              mirror -R -v --overwrite \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                ./ ${REMOTE_PATH}/;
              bye
            "
          }

          deploy_ovh_plain_by_url() {
            local remote_url="$1"
            lftp -c "
              set net:max-retries 5;
              set net:timeout 60;
              set net:reconnect-interval-base 10;
              set net:limit-rate 0;

              set ftp:ssl-allow no;
              set ftp:ssl-force no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ${remote_url};
              mkdir -p ${REMOTE_PATH};
              mirror -R -v --overwrite \
                -X .git \
                -X node_modules \
                -X .github \
                -X .gitignore \
                -X package-lock.json \
                -X package.json \
                -X .cursorrules \
                -X 'infos_ignore.md' \
                -X .env \
                ./ ${REMOTE_PATH}/;
              bye
            "
          }

          verify_theme_by_url() {
            local remote_url="$1"
            ROOT_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;

              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ${remote_url};
              cls -1 ${REMOTE_PATH}/;
              bye
            " 2>&1)
            DIST_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;

              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ${remote_url};
              cls -1 ${REMOTE_PATH}/dist/;
              bye
            " 2>&1)

            echo "$ROOT_OUTPUT" | grep -qw "style.css" && echo "$ROOT_OUTPUT" | grep -qw "functions.php" && echo "$DIST_OUTPUT" | grep -qw "style.css"
          }

          verify_theme_plain() {
            ROOT_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;

              set ftp:ssl-allow no;
              set ftp:ssl-force no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ftp://${OVH_FTP_HOST}:21;
              cls -1 ${REMOTE_PATH}/;
              bye
            " 2>&1)
            DIST_OUTPUT=$(lftp -c "
              set net:max-retries 5;
              set net:timeout 60;

              set ftp:ssl-allow no;
              set ftp:ssl-force no;

              open -u ${OVH_FTP_USER},${OVH_FTP_PASSWORD} ftp://${OVH_FTP_HOST}:21;
              cls -1 ${REMOTE_PATH}/dist/;
              bye
            " 2>&1)

            echo "$ROOT_OUTPUT" | grep -qw "style.css" && echo "$ROOT_OUTPUT" | grep -qw "functions.php" && echo "$DIST_OUTPUT" | grep -qw "style.css"
          }

          theme_ok=false
          if verify_theme_by_url "ftp://${OVH_FTP_HOST}:21"; then
            echo "Theme OK over explicit FTPS (ftp:// + TLS)"
            theme_ok=true
          elif verify_theme_by_url "ftps://${OVH_FTP_HOST}:990"; then
            echo "Theme OK over implicit FTPS (ftps://:990)"
            theme_ok=true
          elif verify_theme_plain; then
            echo "Theme OK over plain FTP (port 21, no TLS)"
            theme_ok=true
          fi

          if [ "$theme_ok" != true ]; then
            echo "Theme files missing, retrying deploy..."
            deploy_ovh_by_url "ftp://${OVH_FTP_HOST}:21" || \
              deploy_ovh_by_url "ftps://${OVH_FTP_HOST}:990" || \
              deploy_ovh_plain_by_url "ftp://${OVH_FTP_HOST}:21"
            theme_ok=false
            if verify_theme_by_url "ftp://${OVH_FTP_HOST}:21"; then
              theme_ok=true
            elif verify_theme_by_url "ftps://${OVH_FTP_HOST}:990"; then
              theme_ok=true
            elif verify_theme_plain; then
              theme_ok=true
            fi
            if [ "$theme_ok" != true ]; then
              echo "::error::DEPLOY FAILED — Theme not found on server. style.css, dist/style.css and/or functions.php missing in $REMOTE_PATH"
              exit 1
            fi
          fi

          echo "Theme OK: style.css, dist/style.css and functions.php found"

      - name: Purge cache
        if: github.event_name == 'push' && vars.OVH_PURGE_ENABLED == 'true'
        run: |
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "${{ secrets.OVH_CACHE_PURGE_URL }}" | grep -q "200" || echo "Cache purge returned non-200 (continuing)"

      - name: Verify production site is still operational
        if: github.event_name == 'push'
        run: |
          SITE_URL="https://${{ secrets.OVH_DOMAIN }}"
          echo "Post-deploy check: $SITE_URL..."
          curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -q "200\|301\|302" || (echo "Site unreachable after deployment"; exit 1)
