name: Deploy to Hostinger (SSH+rsync)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy with rsync (po only)
        run: |
          rsync -az --delete \
          --exclude ".git/" --exclude ".github/" \
          -e "ssh -p ${{ secrets.SSH_PORT }}" \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html//wp-content/themes/parisii-optique/
